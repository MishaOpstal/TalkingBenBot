services:
  talking-ben:
    build: .
    image: talking-ben-bot
    container_name: talking-ben
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data          # per-server settings (guilds.json)
      - ./models:/app/models      # speech model, downloaded on first start
      - ./assets:/app/assets:ro   # swap sounds without rebuilding
    mem_limit: 512m
